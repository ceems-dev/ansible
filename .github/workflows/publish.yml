---
name: Ansible collection publish
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ansible-core
        run: python -m pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build --output-path dist

      - name: Upload built collection to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ceems-ansible-*.tar.gz
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

      - name: Publish collection on galaxy
        uses: ansible/ansible-publish-action@v1.0.0
        with:
          api_key: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
